<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Avistamiento</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Registrar Avistamiento</h1>
  <nav class="nav">
    <ul>
      <li><a href="/avistamientos" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">

    <h2>Formulario de Nuevo Avistamiento</h2>

    <form th:action="@{/avistamientos/guardar}" th:object="${avistamiento}" method="post" 
      class="formulario" enctype="multipart/form-data">

      <!-- Tipo -->
      <div class="campo">
        <label>Tipo:</label>
        <input type="text" th:field="*{tipo}" placeholder="Ej. Observación" required />
      </div>

      <!-- Clima -->
      <div class="campo">
        <label>Clima:</label>
        <input type="text" th:field="*{clima}" placeholder="Ej. Soleado" required />
      </div>

      <!-- Descripción -->
      <div class="campo">
        <label>Descripción:</label>
        <textarea th:field="*{descripcion}" placeholder="Detalles del avistamiento" required></textarea>
      </div>

      <!-- Cantidad -->
      <div class="campo">
        <label>Cantidad observada:</label>
        <input type="number" th:field="*{cantidad}" placeholder="Cantidad" required />
      </div>

      <!-- Animal -->
  <div class="campo">
    <label>Animal:</label>
    <select name="idAnimal" required>
      <option value="" disabled selected>Seleccione un animal</option>
      <option th:each="animal : ${animales}" 
              th:value="${animal.idAnimal}" 
              th:text="${animal.nombreComun}"></option>
    </select>
  </div>

  <!-- Ubicación -->
  <div class="campo">
    <label>Ubicación:</label>
    <select name="idUbicacion" required>
      <option value="" disabled selected>Seleccione una ubicación</option>
      <option th:each="ubi : ${ubicaciones}" 
              th:value="${ubi.idUbicacion}" 
              th:text="${ubi.nombre}"></option>
    </select>
  </div>

  <!-- Observador oculto -->
  <input type="hidden" name="idObservador" th:value="${usuario.idObservador}" />

  <div class="campo">
    <label>Archivos Multimedia:</label>
    <input type="file" name="archivos" multiple accept="image/*" onchange="previewImages(event)">
</div>

<div id="preview" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px;"></div>

  <div class="botones-formulario">
    <button type="submit" class="boton agregar">Guardar</button>
    <a href="/avistamientos" class="boton cancelar">Cancelar</a>
  </div>
</form>

  </section>
</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

<script>
function previewImages(event) {
    const preview = document.getElementById('preview');
    preview.innerHTML = ""; // limpia previas

    for (const file of event.target.files) {
        if (!file.type.startsWith("image/")) continue;

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.style.width = "120px";
        img.style.height = "120px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "10px";
        img.style.boxShadow = "0px 2px 5px rgba(0,0,0,0.25)";

        preview.appendChild(img);
    }
}
</script>

</body>
</html>
