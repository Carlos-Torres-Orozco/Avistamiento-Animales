<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Animal</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Editar Animal</h1>
  <nav class="nav">
    <ul>
      <li><a href="/animales" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta form-card">
    <h2>Actualizar Datos del Animal</h2>

    <form th:action="@{/animales/actualizar}" th:object="${animal}" method="post">
      
      <div class="campo">
        <label>ID (no editable):</label>
        <input type="text" th:field="*{idAnimal}" readonly />
      </div>

      <div class="campo">
        <label>Nombre Común:</label>
        <input type="text" th:field="*{nombreComun}" placeholder="Nombre Común" required />
      </div>

      <div class="campo">
        <label>Especie:</label>
        <select th:field="*{especie}" required>
          <option value="" disabled>Seleccione una especie</option>
          <option th:each="esp : ${especies}"
                  th:value="${esp.idEspecie}"
                  th:text="${esp.nombre}"
                  th:selected="${animal.especie != null and animal.especie.idEspecie == esp.idEspecie}">
          </option>
        </select>
      </div>

      <div class="campo">
        <label>Estado de conservación:</label>
        <input type="text" th:field="*{estadoConservacion}" placeholder="Estado de conservación" required />
      </div>

      <div class="campo">
        <label>Protegido:</label>
        <select th:field="*{protegido}" required>
          <option value="N" th:selected="${animal.protegido == 'N'}">No</option>
          <option value="S" th:selected="${animal.protegido == 'S'}">Sí</option>
        </select>
      </div>

      <div class="botones-formulario">
        <button type="submit" class="boton agregar">Guardar cambios</button>
        <a href="/animales" class="boton cancelar">Cancelar</a>
      </div>

    </form>
  </section>
</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
