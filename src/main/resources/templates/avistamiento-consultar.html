<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Avistamientos</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-cards.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Lista de Avistamientos</h1>
  <nav class="nav">
    <ul>
      <li><a href="/avistamientos" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="grid-cards">

    <div th:each="av : ${avistamientos}" class="card-animal">
      
      <h3 th:text="${av.animal != null ? av.animal.nombreComun : '—'}">Animal</h3>

      <p><strong>ID:</strong> <span th:text="${av.idAvistamiento}"></span></p>
      <p><strong>Tipo:</strong> <span th:text="${av.tipo}"></span></p>
      <p><strong>Clima:</strong> <span th:text="${av.clima}"></span></p>
      <p><strong>Descripción:</strong> <span th:text="${av.descripcion}"></span></p>
      <p><strong>Cantidad:</strong> <span th:text="${av.cantidad}"></span></p>
      <p><strong>Observador:</strong> <span th:text="${av.observador != null ? av.observador.nombre : '—'}"></span></p>
      <p><strong>Ubicación:</strong> <span th:text="${av.ubicacion != null ? av.ubicacion.nombre : '—'}"></span></p>

      <div class="botones-card">
        <a th:href="@{'/avistamientos/editar/' + ${av.idAvistamiento}}" class="btn editar">Editar</a>
        <a th:href="@{'/avistamientos/eliminar/' + ${av.idAvistamiento}}" 
           class="btn eliminar"
           onclick="return confirm('¿Seguro que deseas eliminar este avistamiento y sus registros asociados?')">Eliminar</a>
        <a th:href="@{'/avistamientos/multimedia/' + ${av.idAvistamiento}}" class="btn ver">Ver Multimedia</a>
      </div>

    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
