<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Ubicaciones</title>
  <!-- Estilo moderno, igual que animales -->
  <link rel="stylesheet" href="/style/style-animales.css">
</head>
<body class="modern-page" th:attr="data-rol=${usuario != null ? usuario.rol : 'NULL'}">

<header class="header">
  <h1>Gestión de Ubicaciones</h1>
  <nav class="nav">
    <ul>
      <li>
        <a th:if="${usuario != null and usuario.rol == 'admin'}"
           th:href="@{/admin/home}" 
           class="btn-regresar"
           onclick="console.log('Rol del usuario:', this.closest('body').dataset.rol)">
           Regresar
        </a>
        <a th:if="${usuario == null or usuario.rol != 'admin'}"
           th:href="@{/observador/home}" 
           class="btn-regresar"
           onclick="console.log('Rol del usuario:', this.closest('body').dataset.rol)">
           Regresar
        </a>
      </li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">
    <h2>Administrar Ubicaciones</h2>
    <p>Selecciona una acción para gestionar las ubicaciones registradas en el sistema:</p>

    <div class="grid-modulos">
      <button class="modulo" onclick="location.href='/ubicaciones/agregar'">➕ Agregar Ubicación</button>
      <button class="modulo" onclick="location.href='/ubicaciones/consultar'">📄 Consultar / Actualizar / Eliminar</button>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
