<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Multimedia del Avistamiento</title>
  <link rel="stylesheet" href="/style/style-multimedia.css">
</head>
<body class="multimedia-page">

<header class="header">
  <h1>Archivos Multimedia</h1>
  <nav class="nav">
    <ul>
      <li><a href="/avistamientos/consultar">Regresar a Avistamientos</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="contenido">
    <h2 th:text="'Multimedia del Avistamiento: ' + ${avistamiento.idAvistamiento}"></h2>

    <div class="grid-cards">
      <div class="card-multimedia" th:each="m : ${multimedias}">
        <!-- Mostrar imagen si es tipo "Imagen" -->
       <img th:if="${m.tipo != null and m.tipo.toLowerCase().contains('image')}"
     th:src="@{/uploads/{archivo}(archivo=${m.archivo})}"
     th:alt="${m.archivo}">


        
        <h3 th:text="${m.tipo}"></h3>
        <p th:text="${m.archivo}"></p>
        <p th:text="${m.fecha}"></p>

        <div class="botones-card">
          <a th:href="@{'/multimedia/eliminar/' + ${m.idImagen}}" 
             class="btn eliminar"
             th:onclick="'return confirm(\'¿Eliminar este archivo multimedia? Si es el último, también se eliminará el avistamiento.\')'">
             Eliminar
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
