<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Animales</title>
  <link rel="stylesheet" href="/style/style-animales.css">
</head>
<body class="modern-page" th:attr="data-rol=${usuario != null ? usuario.rol : 'NULL'}">

<header class="header">
  <h1>Gestión de Animales</h1>
  <nav class="nav">
    <ul>
      <a th:if="${usuario != null and usuario.rol == 'admin'}"
         th:href="@{/admin/home}" 
         class="btn-regresar"
         onclick="console.log('Rol del usuario:', this.closest('body').dataset.rol)">
         Regresar
      </a>

      <a th:if="${usuario == null or usuario.rol != 'admin'}"
         th:href="@{/observador/home}" 
         class="btn-regresar"
         onclick="console.log('Rol del usuario:', this.closest('body').dataset.rol)">
         Regresar
      </a>

    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">
    <h2>Opciones de Gestión</h2>
    <p>Selecciona una acción para administrar los animales registrados:</p>

    <div class="grid-modulos">
      <a href="/animales/agregar" class="modulo">➕ Agregar Animal</a>
      <a href="/animales/consultar" class="modulo">📄 Consultar / Actualizar / Eliminar</a>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
