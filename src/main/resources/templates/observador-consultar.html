<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Observadores</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-cards.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Lista de Observadores</h1>
  <nav class="nav">
    <ul>
      <li><a href="/observadores" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="grid-cards">

    <div th:each="obs : ${observadores}" class="card-animal">

      <h3 th:text="${obs.nombre} + ' ' + ${obs.apellido}">Nombre Observador</h3>

      <!-- Correo -->
      <p><strong>Correo:</strong> <span th:text="${obs.correo}"></span></p>

      <!-- País con bandera -->
      <p>
        <strong>País:</strong>
        <img th:id="'flag-' + ${obs.idObservador}" 
             alt="Bandera" 
             style="vertical-align:middle; margin-right:5px; width:24px; height:18px;">
        <span th:text="${obs.pais}"></span>
      </p>

      <!-- Institución -->
      <p><strong>Institución:</strong> <span th:text="${obs.institucion}"></span></p>

      <!-- Rol -->
      <p><strong>Rol:</strong> <span th:text="${obs.rol == 'admin' ? 'Administrador' : 'Observador'}"></span></p>

      <div class="botones-card">
        <a th:href="@{'/observadores/editar/' + ${obs.idObservador}}" class="btn editar">Editar</a>
        <a th:href="@{'/observadores/eliminar/' + ${obs.idObservador}}" class="btn eliminar"
           onclick="return confirm('¿Seguro que deseas eliminar este observador?')">Eliminar</a>
      </div>

    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>
