<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Especies</title>

  <!-- Estilos generales modernos -->
  <link rel="stylesheet" href="/style/style-especies-cards.css">
</head>

<body class="modern-page">

<header>
  <h1>Lista de Especies</h1>
  <nav>
    <ul>
      <li><a href="/especies" class="btn.regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">

  <section class="grid-cards">
    <div th:each="esp : ${especies}" class="card-especie">

      <h3 th:text="${esp.nombre}">Nombre Científico</h3>
      <p><strong>Género:</strong> <span th:text="${esp.genero}"></span></p>
      <p><strong>Familia:</strong> <span th:text="${esp.familia}"></span></p>
      <p><strong>Orden:</strong> <span th:text="${esp.orden}"></span></p>
      <p><strong>Clase:</strong> <span th:text="${esp.clase}"></span></p>
      <p><strong>Filo:</strong> <span th:text="${esp.filo}"></span></p>
      <p><strong>Descripción:</strong> <span th:text="${esp.descripcion}"></span></p>

      <div class="botones-card">
        <a th:href="@{'/especies/editar/' + ${esp.idEspecie}}" class="btn editar">Editar</a>
        <a th:href="@{'/especies/eliminar/' + ${esp.idEspecie}}" class="btn eliminar"
           onclick="return confirm('¿Seguro que deseas eliminar esta especie?')">Eliminar</a>
      </div>

    </div>
  </section>

</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
