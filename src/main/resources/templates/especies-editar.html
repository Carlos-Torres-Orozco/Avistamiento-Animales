<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Especie</title>

  <!-- Estilos modernos independientes -->
  <link rel="stylesheet" th:href="@{/style/style-especies-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Editar Especie</h1>
  <nav class="nav">
    <ul>
      <li><a href="/especies/consultar" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">

  <section class="tarjeta form-card">

    <h2>Actualizar Datos de la Especie</h2>

    <form th:action="@{/especies/actualizar}" th:object="${especie}" method="post">

      <div class="campo">
        <label>ID (no editable):</label>
        <input type="text" th:field="*{idEspecie}" readonly />
      </div>

      <div class="campo">
        <label>Nombre Científico:</label>
        <input type="text" th:field="*{nombre}" required />
      </div>

      <div class="campo">
        <label>Género:</label>
        <input type="text" th:field="*{genero}" required />
      </div>

      <div class="campo">
        <label>Familia:</label>
        <input type="text" th:field="*{familia}" required />
      </div>

      <div class="campo">
        <label>Orden:</label>
        <input type="text" th:field="*{orden}" required />
      </div>

      <div class="campo">
        <label>Clase:</label>
        <input type="text" th:field="*{clase}" required />
      </div>

      <div class="campo">
        <label>Filo:</label>
        <input type="text" th:field="*{filo}" required />
      </div>

      <div class="campo">
        <label>Descripción:</label>
        <textarea th:field="*{descripcion}" required></textarea>
      </div>

      <div class="botones-formulario">
        <button type="submit" class="btn guardar">Guardar cambios</button>
        <a href="/especies" class="btn cancelar">Cancelar</a>
      </div>

    </form>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
