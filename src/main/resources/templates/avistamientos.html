<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Avistamientos</title>
  <link rel="stylesheet" th:href="@{/style/style-animales.css}">
</head>
<body class="modern-page" th:attr="data-rol=${usuario != null ? usuario.rol : 'NULL'}">

<header class="header">
  <h1>Gestión de Avistamientos</h1>
  <nav class="nav">
    <ul>
      <li>
        <a th:if="${usuario != null and usuario.rol == 'admin'}"
           th:href="@{/admin/home}" 
           class="btn-regresar">
           Regresar
        </a>
        <a th:if="${usuario == null or usuario.rol != 'admin'}"
           th:href="@{/observador/home}" 
           class="btn-regresar">
           Regresar
        </a>
      </li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">
    <h2>Administrar Avistamientos</h2>
    <p>Selecciona una acción para gestionar los avistamientos registrados en el sistema:</p>

    <div class="grid-modulos">
      <button class="modulo" onclick="location.href='/avistamientos/agregar'">➕ Agregar Avistamiento</button>
      <button class="modulo" onclick="location.href='/avistamientos/consultar'">📄 Consultar / Actualizar / Eliminar</button>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
