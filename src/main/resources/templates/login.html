<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/style/login.css}">
</head>
<body>

<div class="container">
    <div class="login-box">

        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Accede para gestionar los avistamientos</p>

        <form method="post" th:action="@{/login}">
            <div class="input-group">
                <label>Correo</label>
                <input type="email" name="username" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>

            <p th:if="${param.error}" class="error">Credenciales incorrectas</p>

            <button type="submit" class="btn">Entrar</button>

            <p class="register">
                ¿No tienes cuenta? 
                <a th:href="@{/observadores/crear-cuenta}">Regístrate aquí</a>
            </p>
        </form>

    </div>
</div>

</body>
</html>
