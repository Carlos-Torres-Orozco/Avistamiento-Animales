<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Ubicación</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Editar Ubicación</h1>
  <nav class="nav">
    <ul>
      <li><a href="/ubicaciones" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta form-card">
    <h2>Actualizar Datos de la Ubicación</h2>

    <form th:action="@{/ubicaciones/actualizar}" th:object="${ubicacion}" method="post">

      <div class="campo">
        <label>ID (no editable):</label>
        <input type="text" th:field="*{idUbicacion}" readonly />
      </div>

      <div class="campo">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required />
      </div>

      <div class="campo">
        <label>País:</label>
        <input type="text" th:field="*{pais}" placeholder="País" required />
      </div>

      <div class="campo">
        <label>Región:</label>
        <input type="text" th:field="*{region}" placeholder="Región" required />
      </div>

      <div class="campo">
        <label>Habitat:</label>
        <input type="text" th:field="*{habitad}" placeholder="Habitat" required />
      </div>

      <div class="botones-formulario">
        <button type="submit" class="boton agregar">Guardar cambios</button>
        <a href="/ubicaciones" class="boton cancelar">Cancelar</a>
      </div>

    </form>
  </section>
</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
