<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Avistamiento</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Editar Avistamiento</h1>
  <nav class="nav">
    <ul>
      <li><a href="/avistamientos" class="btn-regresar">Volver</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">
    <h2>Actualizar Datos del Avistamiento</h2>

    <form th:action="@{/avistamientos/actualizar}" th:object="${avistamiento}"
      method="post" class="formulario" enctype="multipart/form-data">

      <!-- ID no editable -->
      <div class="campo">
        <label>ID (no editable):</label>
        <input type="text" th:field="*{idAvistamiento}" readonly />
      </div>

      <!-- Tipo -->
      <div class="campo">
        <label>Tipo:</label>
        <input type="text" th:field="*{tipo}" required />
      </div>

      <!-- Clima -->
      <div class="campo">
        <label>Clima:</label>
        <input type="text" th:field="*{clima}" required />
      </div>

      <!-- Descripción -->
      <div class="campo">
        <label>Descripción:</label>
        <textarea th:field="*{descripcion}" rows="3" required></textarea>
      </div>

      <!-- Cantidad -->
      <div class="campo">
        <label>Cantidad:</label>
        <input type="number" th:field="*{cantidad}" min="1" required />
      </div>

      <!-- Animal -->
      <div class="campo">
        <label>Animal:</label>
        <select th:field="*{animal}" required>
          <option value="" disabled>Seleccione un animal</option>
          <option th:each="ani : ${animales}"
                  th:value="${ani.idAnimal}"
                  th:text="${ani.nombreComun}"
                  th:selected="${avistamiento.animal != null and avistamiento.animal.idAnimal == ani.idAnimal}">
          </option>
        </select>
      </div>

      <!-- Observador (oculto, se llena automáticamente) -->
      <input type="hidden" th:field="*{observador}" th:value="${usuario.idObservador}" />

      <!-- Ubicación -->
      <div class="campo">
        <label>Ubicación:</label>
        <select th:field="*{ubicacion}" required>
          <option value="" disabled>Seleccione una ubicación</option>
          <option th:each="ubi : ${ubicaciones}"
                  th:value="${ubi.idUbicacion}"
                  th:text="${ubi.nombre}"
                  th:selected="${avistamiento.ubicacion != null and avistamiento.ubicacion.idUbicacion == ubi.idUbicacion}">
          </option>
        </select>
      </div>

      <!-- Multimedia existente -->
      <div class="campo">
        <label>Multimedia existente:</label>
        <div th:each="multi, iterStat : ${avistamiento.multimedias}" class="multimedia-item">
          <input type="text" th:value="${multi.tipo}" readonly placeholder="Tipo">
          <input type="text" th:value="${multi.archivo}" readonly placeholder="Archivo">
          <input type="date" th:value="${multi.fecha}" readonly>
        </div>
      </div>

      <div class="campo">
    <label>Multimedia existente:</label>

    <div class="multimedia-item" th:each="multi : ${avistamiento.multimedias}">
        <p><strong>Archivo:</strong> <span th:text="${multi.archivo}"></span></p>
        <p><strong>Tipo:</strong> <span th:text="${multi.tipo}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${multi.fecha}"></span></p>
    </div>
</div>

<div class="campo">
    <label>Agregar nuevas imágenes:</label>
    <input type="file" name="archivos" multiple accept="image/*">
</div>

      <!-- Botones -->
      <div class="botones-formulario">
        <button type="submit" class="boton agregar">Guardar cambios</button>
        <a href="/avistamientos" class="boton cancelar">Cancelar</a>
      </div>

    </form>
  </section>
</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

<script>
let index = /*[[${avistamiento.multimedias.size()}]]*/ 0;

function agregarMultimedia() {
    const container = document.getElementById('multimedia-container');
    const div = document.createElement('div');
    div.classList.add('multimedia-item');
    div.innerHTML = `
        <label>Tipo:</label>
        <input type="text" name="multimedias[${index}].tipo" required>
        <label>Archivo (URL o nombre):</label>
        <input type="text" name="multimedias[${index}].archivo" required>
        <label>Fecha:</label>
        <input type="date" name="multimedias[${index}].fecha" required>
    `;
    container.appendChild(div);
    index++;
}
</script>
</body>
</html>
