<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Ubicación</title>
  <link rel="stylesheet" th:href="@{/style/style-animales-form.css}">
</head>
<body class="modern-page">

<header class="header">
  <h1>Agregar Ubicación</h1>
  <nav class="nav">
    <ul>
      <li><a href="/ubicaciones" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="tarjeta">

    <h2>Formulario de Nueva Ubicación</h2>

    <form th:action="@{/ubicaciones/guardar}" th:object="${ubicacion}" method="post" class="formulario">
      
      <div class="campo">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required />
      </div>

      <div class="campo">
        <label>País:</label>
        <select th:field="*{pais}" required>
          <option value="" disabled selected>Selecciona un país</option>
          <option th:each="pais : ${paises}" 
                  th:value="${pais}" 
                  th:text="${pais}">
          </option>
        </select>
      </div>


      <div class="campo">
        <label>Región:</label>
        <input type="text" th:field="*{region}" placeholder="Región" required />
      </div>

      <div class="campo">
        <label>Habitad:</label>
        <input type="text" th:field="*{habitad}" placeholder="Habitat" required />
      </div>

      <div class="botones-formulario">
        <button type="submit" class="boton agregar">Guardar</button>
        <a href="/ubicaciones" class="boton cancelar">Cancelar</a>
      </div>

    </form>
  </section>
</main>

<footer>
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
