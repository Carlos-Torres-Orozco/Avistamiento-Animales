<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Animales</title>
  <link rel="stylesheet" href="/style/style-animales-cards.css">
</head>
<body class="modern-page">

<header class="header">
  <h1>Lista de Animales</h1>
  <nav class="nav">
    <ul>
      <li><a href="/animales" class="btn-regresar">Regresar</a></li>
    </ul>
  </nav>
</header>

<main class="contenido">
  <section class="grid-cards">
    <div th:each="ani : ${animales}" 
         class="card-animal" 
         th:classappend="${ani.protegido == 'S'} ? ' protegido' : ' no-protegido'">

      <h3 th:text="${ani.nombreComun}">Nombre Común</h3>
      <p><strong>Especie:</strong> <span th:text="${ani.especie.nombre}"></span></p>
      <p><strong>Estado de conservación:</strong> <span th:text="${ani.estadoConservacion}"></span></p>
      <p><strong>Protegido:</strong> <span th:text="${ani.protegido == 'S' ? 'Sí' : 'No'}"></span></p>

      <div class="botones-card">
        <a th:href="@{'/animales/editar/' + ${ani.idAnimal}}" class="btn editar">Editar</a>
        <a th:href="@{'/animales/eliminar/' + ${ani.idAnimal}}" 
           class="btn eliminar"
           onclick="return confirm('¿Seguro que deseas eliminar este animal, se eliminarán los registros que dependen de él?')">
           Eliminar
        </a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2025 Sistema de Avistamientos</p>
</footer>

</body>
</html>
